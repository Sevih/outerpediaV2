name: Build & push image

# À chaque push sur main, GitHub construit l'image Docker et la publie sur
# GHCR (le registre d'images de GitHub). Le serveur n'a plus qu'à la tirer.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}   # permet aussi un déclenchement manuel

env:
  REGISTRY: ghcr.io
  # Nom de l'image (doit être en minuscules pour GHCR).
  IMAGE_NAME: sevih/outerpedia

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # autorise la publication sur GHCR
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        # depth=1 par défaut : ne tire pas les 3,4 Go d'historique.

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # fourni automatiquement

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache de build entre exécutions -> builds suivants beaucoup plus rapides.
          cache-from: type=gha
          cache-to: type=gha,mode=max
